name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.23
      - run: aiken fmt --check
      - run: aiken check -D
      # The assertions env compiles env/with_assertions.ak in place of the
      # default no-op, enforcing prog_assets.collect's documented no-ada
      # pre-condition. Without this step that assertion never executes.
      - run: aiken check -D --env with_assertions
      - run: aiken build
      # Prose cites the validators by line. Nothing else in CI reads prose, so
      # those anchors rot silently -- a comment-only edit moves every line
      # below it and no test notices. This fails the build instead.
      - run: python3 .github/scripts/check-doc-line-citations.py
